openapi: 3.0.3
info:
  title: نظام إدارة التوزيع والمندوبين — API
  version: 3.0.0
  description: 'عقد الواجهات لنظام إدارة التوزيع والمندوبين — Bellaby (عبر Trust).

    الباك إند Laravel (API فقط)، الويب Next.js، تطبيق المندوب React Native (Expo).


    المرجع: وثيقة المتطلبات SRS v1.3 (8 تشرين الثاني 2026) وملحق القرارات 1–15.

    يحل محل الإصدارين 1.0 و2.0 من هذا العقد.


    الاصطلاحات: الأوقات تُخزَّن وتُرسل UTC بصيغة ISO-8601، وكل حساب لـ«اليوم» و«منتصف الليل» و«الشهر» بتوقيت Asia/Damascus.

    المبالغ بالدولار نص عشري ("125.50"). الكميات أعداد صحيحة. الحالات بأحرف كبيرة (PENDING ...).

    القوائم مرقّمة بأسلوب Laravel (data + meta + links). لا حذف للعمليات: إلغاء أو قيد معاكس، وكل قرار يُسجَّل في التدقيق.'
  contact: {name: Deep Code, url: 'https://deepcode.dev'}
servers:
- {url: 'https://api.example.com/api/v1', description: الإنتاج (النطاق يُحدَّد لاحقًا)}
- {url: 'http://localhost:8000/api/v1', description: التطوير المحلي}
security:
- clerkAuth: []
tags:
- {name: Auth, description: الدخول والهوية وربط الجهاز}
- {name: Users & IT, description: الحسابات والأدوار والأجهزة والأمان والتفويض}
- {name: Settings, description: الإعدادات والقوائم والهيكل الجغرافي والعطل والأوزان}
- {name: Items & Batches, description: الأصناف والأسعار وتكلفة الوحدة والدفعات والسحب}
- {name: Stock, description: المواقع والأرصدة والحركات والإدخال والتنبيهات}
- {name: Transfers, description: الصرف وطلبات العينات وطلبات السحب}
- {name: Stock Counts & Damage, description: الجرد والتالف}
- {name: Agents & Sales, description: الوكلاء والعملاء والتسليمات والتحصيل}
- {name: Returns, description: مرتجع الصيدلية وإرجاع الوكيل}
- {name: Field, description: جهات الزيارة والزيارات والدوام والتقارير اليومية ومعلومات السوق}
- {name: Leaves, description: الإجازات لكل الموظفين}
- {name: Monitoring, description: العلامات وملفات التحقيق}
- {name: Tasks & Requests, description: المهام والخصومات والطلبات بين الأقسام}
- {name: Periodic Reports & Plans, description: التقرير الدوري الموحّد والخطة الشهرية}
- {name: Scoring & Expenses, description: النقاط وإغلاق الشهر وموظف الشهر والميزانية والمصاريف}
- {name: Dashboards & Reports, description: لوحات القيادة وتقارير المحاسبة}
- {name: Legal, description: الوثائق القانونية والنزاعات}
- {name: Website, description: إدارة الموقع ورسائله}
- {name: Public Website, description: واجهات عامة لموقع الشركة}
- {name: Mobile, description: تطبيق المندوب والمزامنة دون اتصال}
- {name: System, description: الإشعارات والرفع والسجلات}
paths:
  /auth/rep/otp/request:
    post:
      tags: [Auth]
      summary: طلب رمز دخول للمندوب عبر واتساب
      description: 'الرقم غير المسجّل كمندوب: 404 `phone_not_registered` لتعرض الواجهة «هذا الرقم غير مسجّل كمندوب». صلاحية الرمز 5 دقائق.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {$ref: '#/components/schemas/Phone'}
              required: [phone]
      responses:
        '202':
          description: تم
          content:
            application/json:
              schema:
                type: object
                properties:
                  resend_after_seconds: {type: integer, example: 60}
                  expires_in_seconds: {type: integer, example: 300}
        '404':
          description: الرقم غير مسجّل كمندوب (phone_not_registered)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/rep/otp/verify:
    post:
      tags: [Auth]
      summary: التحقق من الرمز وربط الجهاز
      description: 'أول دخول ناجح لحساب بلا جهاز مربوط يربط هذا الجهاز تلقائيًا. جهاز آخر: 403 `device_not_authorized` مع `device_token` لشاشة
        «جهاز غير مصرّح» وزر طلب موافقة IT. رموز 401: `otp_invalid`, `otp_expired`. 403 أيضًا: `account_disabled`, `device_blocked`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {$ref: '#/components/schemas/Phone'}
                code: {type: string, pattern: '^[0-9]{6}$'}
                device_id: {type: string, maxLength: 100}
                device_name: {type: string, maxLength: 100}
                app_version: {type: string, example: 1.3.0}
              required: [phone, code, device_id, app_version]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  device_bound_now: {type: boolean}
                  user: {$ref: '#/components/schemas/Me'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403':
          description: device_not_authorized / account_disabled / device_blocked
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Error'}
                - type: object
                  properties:
                    device_token: {type: string, description: يُستخدم في طلب تغيير الجهاز وفي متابعة حالته, nullable: true}
                    change_request_status:
                      type: string
                      enum: [PENDING, REJECTED]
                      nullable: true
  /auth/rep/device-change-request:
    post:
      tags: [Auth]
      summary: طلب موافقة IT على هذا الجهاز
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_token: {type: string}
                note: {type: string}
              required: [device_token]
      responses:
        '201':
          description: تم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [PENDING, APPROVED, REJECTED]
        '422': {$ref: '#/components/responses/ValidationError'}
        '409':
          description: يوجد طلب معلّق
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      tags: [Auth]
      summary: حالة طلب تغيير الجهاز
      security: []
      parameters:
      - name: device_token
        in: query
        schema: {type: string}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [PENDING, APPROVED, REJECTED]
                      reason: {type: string, nullable: true}
        '404': {$ref: '#/components/responses/NotFound'}
  /auth/rep/logout:
    post:
      tags: [Auth]
      summary: تسجيل خروج المندوب
      description: 'قاعدة في التطبيق وحده: يُرفض الخروج ما دام في الطابور سجل لم يُرفع («زامن أولًا»).'
      security:
      - repAuth: []
      responses:
        '204': {description: تم}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me:
    get:
      tags: [Auth]
      summary: المستخدم الحالي وصلاحياته
      description: 'لبريد غير مضاف: 403 `account_not_provisioned` ويُسجَّل حدث أمني؛ لبريد محظور: 403 `email_blocked`.'
      security:
      - clerkAuth: []
      - repAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/profile:
    get:
      tags: [Auth]
      summary: بروفايلي (البيانات، وصف المهام، العقد، التقييمات، الخصومات)
      security:
      - clerkAuth: []
      - repAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/assignees:
    get:
      tags: [Auth]
      summary: من يمكنني إسناد مهام إليهم
      description: 'من التبعية المباشرة لا من الدور، وتفرغ لمن لا فريق له. المدير التنفيذي: الجميع.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/UserRef'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/pending-decisions:
    get:
      tags: [Auth]
      summary: «بانتظار قراري» — صندوق واحد، الأقدم أولًا
      description: للمدير التنفيذي كل ما ينتظر قراره؛ وللمفوَّض ما يشمله التفويض بين تاريخيه دون ما يخصّه.
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      - name: kind
        in: query
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Paginated'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/PendingDecision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users:
    get:
      tags: [Users & IT]
      summary: المستخدمون
      description: 'الصلاحية: `users.view`.'
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      - {$ref: '#/components/parameters/Q'}
      - name: role_id
        in: query
        schema: {type: integer}
      - name: department
        in: query
        schema: {$ref: '#/components/schemas/Department'}
      - {$ref: '#/components/parameters/AgentId'}
      - name: is_active
        in: query
        schema: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Paginated'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users & IT]
      summary: إنشاء حساب (لا تسجيل ذاتي)
      description: 'الصلاحية: `users.manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '201':
          description: تم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /users/{id}:
    get:
      tags: [Users & IT]
      summary: مستخدم
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Users & IT]
      summary: تعديل مستخدم
      description: 'الصلاحية: `users.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /users/{id}/profile:
    get:
      tags: [Users & IT]
      summary: بروفايل موظف
      description: العقد والراتب لا يظهران إلا للمدير التنفيذي ومدير المحاسبة.
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/contract:
    put:
      tags: [Users & IT]
      summary: العقد والراتب في البروفايل
      description: 'الصلاحية: `contracts.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContractInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /users/{id}/deactivation-preview:
    get:
      tags: [Users & IT]
      summary: ما هو معلّق على الحساب قبل تعطيله
      description: 'الصلاحية: `users.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DeactivationPreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/deactivate:
    post:
      tags: [Users & IT]
      summary: تعطيل حساب (فوري)
      description: 'الصلاحية: `users.manage`.


        يفك ربط الجهاز وينهي الجلسة. رصيد المندوب: تنبيه للوجستي. رصيد الوكيل: يتولاه مدير المبيعات. المهام التي أسندها تنتقل لمديره المباشر.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 1000}
              required: [reason]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /users/{id}/activate:
    post:
      tags: [Users & IT]
      summary: إعادة تفعيل
      description: 'الصلاحية: `users.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /permissions:
    get:
      tags: [Users & IT]
      summary: الصلاحيات حسب الوحدة
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        module: {type: string}
                        module_label: {type: string}
                        permissions:
                          type: array
                          items: {$ref: '#/components/schemas/Permission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /roles:
    get:
      tags: [Users & IT]
      summary: الأدوار
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users & IT]
      summary: إنشاء دور
      description: 'الصلاحية: `roles.manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleInput'}
      responses:
        '201':
          description: تم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /roles/{id}:
    put:
      tags: [Users & IT]
      summary: تعديل دور وصلاحياته ووصف مهامه
      description: 'الصلاحية: `roles.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409':
          description: دور نظام مقفل (system_role_locked)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      tags: [Users & IT]
      summary: حذف دور غير مستخدم
      description: 'الصلاحية: `roles.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: تم}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: role_in_use / system_role_locked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /devices:
    get:
      tags: [Users & IT]
      summary: الأجهزة المربوطة
      description: 'الصلاحية: `devices.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      - {$ref: '#/components/parameters/UserId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Paginated'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Device'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /device-change-requests:
    get:
      tags: [Users & IT]
      summary: طلبات تغيير الجهاز
      description: 'الصلاحية: `devices.manage`.'
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Paginated'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/DeviceChangeRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /device-change-requests/{id}/decision:
    post:
      tags: [Users & IT]
      summary: موافقة أو رفض تغيير الجهاز
      description: 'الصلاحية: `devices.manage`.


        الموافقة تنقل الربط وتنهي جلسة القديم. المهلة 24 ساعة عمل.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED]
                reason: {type: string}
              required: [decision, reason]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DeviceChangeRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
