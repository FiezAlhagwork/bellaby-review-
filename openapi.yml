        PHOTO_PENDING]
      description: نوع العلامة
    FlagStatus:
      type: string
      enum: [OPEN, CLEARED, CONFIRMED, ESCALATED, AUTO_CLEARED]
      description: مفتوحة / لا مشكلة / مشكلة مسجّلة / محوّلة لتحقيق / زال سببها
    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
      description: الإجازة — لكل الموظفين عدا الوكلاء
    TaskStatus:
      type: string
      enum: [NEW, IN_PROGRESS, SUBMITTED, APPROVED, RESOLVED]
      description: «متأخرة» ليست حالة؛ هي is_overdue المحسوبة
    TaskSource:
      type: string
      enum: [MANUAL, PLAN, FOLLOW_UP]
      description: يدوي / من خطة تقرير معتمد / إجراء متابعة من المدير التنفيذي
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH]
      description: أولوية المهمة
    ReportStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVIEWED, RETURNED, APPROVED]
      description: مسودة / بانتظار المراقبة / بانتظار الإدارة / معاد / معتمد
    ReportKind:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, EXCEPTIONAL]
      description: الشهري والربع سنوي والسنوي إجبارية
    ExecReportDecision:
      type: string
      enum: [APPROVE, APPROVE_WITH_NOTES, APPROVE_WITH_FOLLOW_UP, APPROVE_WITH_ADMIN_DECISION, RETURN_FOR_EDIT, REQUEST_INFO]
      description: 'القرارات الستة: الأربعة الأولى → APPROVED (FOLLOW_UP يفتح مهمة لرئيس القسم)، والأخيران → RETURNED'
    DeptRequestStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, DONE, REJECTED]
      description: الطلب بين الأقسام
    TargetType:
      type: string
      enum: [VISITS, CATEGORY, PRODUCT, SALES, SALES_ITEM]
      description: نوع هدف الخطة
    ScoreStatus:
      type: string
      enum: [PROVISIONAL, FINAL]
      description: مبدئية / نهائية
    RatingScale:
      type: string
      enum: ['100', '80', '60', '40', '20']
      description: 'سلّم التقييم الموحّد: ممتاز 100، جيد جدًا 80، جيد 60، مقبول 40، ضعيف 20'
    ExpenseKind:
      type: string
      enum: [COMPUTED, ENTERED]
      description: محسوب من النظام (العينات والمواد) / يُدخله المحاسب
    RegionClass:
      type: string
      enum: [A, B, C, D]
      description: استراتيجية / نمو / اختبار / غير اقتصادية حاليًا
    Department:
      type: string
