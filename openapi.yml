components:
  securitySchemes:
    clerkAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 'مستخدمو الويب: توكن جلسة Clerk (دخول Google). الخادم يتحقق عبر JWKS
        ويربط بالبريد.'}
    repAuth: {type: http, scheme: bearer, description: توكن Sanctum للمندوب من /auth/rep/otp/verify، مربوط بالجهاز.}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Q:
      name: q
      in: query
      schema: {type: string, maxLength: 100}
      description: بحث نصي
    From:
      name: from
      in: query
      schema: {type: string, format: date}
      description: من تاريخ (ضمني، بتوقيت دمشق)
    To:
      name: to
      in: query
      schema: {type: string, format: date}
      description: إلى تاريخ (ضمني، بتوقيت دمشق)
    LocationId:
      name: location_id
      in: query
      schema: {type: integer}
    AgentId:
      name: agent_id
      in: query
      schema: {type: integer}
    RepId:
      name: rep_id
      in: query
      schema: {type: integer}
    UserId:
      name: user_id
      in: query
      schema: {type: integer}
    GovernorateId:
      name: governorate_id
      in: query
      schema: {type: integer}
  responses:
    Unauthorized:
      description: غير مسجّل أو التوكن منتهٍ (unauthenticated)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: لا صلاحية (forbidden)، أو صاحب الطلب هو المفوَّض نفسه (self_decision_forbidden)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: غير موجود أو خارج نطاق المستخدم (not_found)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: خطأ تحقق (validation_failed) أو رمز أعمال محدد
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationErrorBody'}
    TooManyRequests:
      description: تجاوز حد الطلبات (too_many_requests)
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AppUpdateRequired:
      description: إصدار التطبيق أقدم من الحد الأدنى (app_update_required)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      properties:
        message: {type: string, example: لا تملك صلاحية لهذا الإجراء}
        code: {type: string, example: forbidden, description: رمز ثابت تبني عليه الواجهة منطقها}
      required: [message, code]
    ValidationErrorBody:
      type: object
      properties:
        message: {type: string, example: البيانات المدخلة غير صحيحة}
        code: {type: string, example: validation_failed}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          example:
            lines.0.quantity: [الكمية أكبر من الرصيد المتاح]
      required: [message, code, errors]
    ConflictDecided:
      allOf:
      - {$ref: '#/components/schemas/Error'}
      - type: object
        properties:
          current_status: {type: string, example: RESTOCKED}
          decided_by: {$ref: '#/components/schemas/UserRef'}
          decided_at: {type: string, format: date-time}
      description: قرار سابق وصل الخادم أولًا (code = already_decided). القرار الأول هو الساري.
    Paginated:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page: {type: integer, example: 1}
            last_page: {type: integer, example: 4}
            per_page: {type: integer, example: 20}
            total: {type: integer, example: 73}
        links:
          type: object
          properties:
            first: {type: string, nullable: true}
            last: {type: string, nullable: true}
            prev: {type: string, nullable: true}
            next: {type: string, nullable: true}
    Money: {type: string, pattern: '^-?[0-9]+\.[0-9]{2}$', example: '1250.00', description: مبلغ بالدولار كنص عشري بخانتين}
    Phone: {type: string, pattern: '^\+[0-9]{8,15}$', example: '+963944123456', description: E.164}
    Month: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$', example: 2026-11, description: شهر بتوقيت دمشق}
    EnumOption:
      type: object
      properties:
        value: {type: string}
        label: {type: string}
    Governorate:
      type: object
      properties:
        id: {type: integer, example: 3}
        name: {type: string, example: حلب}
    UserRef:
      type: object
      properties:
        id: {type: integer, example: 12}
        name: {type: string, example: سامر حداد}
    ItemRef:
      type: object
      properties:
        id: {type: integer, example: 5}
        name: {type: string, example: حليب أطفال مرحلة 1 — 400غ}
        sku: {type: string, example: BL-INF1-400}
        type: {$ref: '#/components/schemas/ItemType'}
    BatchRef:
      type: object
      properties:
        id: {type: integer, example: 31}
        batch_no: {type: string, example: LOT-2611-A}
        expiry_date: {type: string, format: date}
        status: {$ref: '#/components/schemas/BatchStatus'}
    LocationRef:
      type: object
      properties:
        id: {type: integer, example: 2}
        type: {$ref: '#/components/schemas/LocationType'}
        name: {type: string, example: مستودع دمشق الرئيسي}
    AgentRef:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, example: مؤسسة النور للتوزيع}
        governorates:
          type: array
          items: {$ref: '#/components/schemas/Governorate'}
    Attachment:
      type: object
      properties:
        upload_id: {type: string, format: uuid}
        url: {type: string, format: uri}
        name: {type: string}
        mime: {type: string}
    GeoPoint:
      type: object
      properties:
        lat: {type: number, format: double, example: 33.5138}
        lng: {type: number, format: double, example: 36.2765}
        accuracy_m: {type: number, example: 12.5, description: دقة القراءة بالمتر}
        is_mock: {type: boolean, description: قراءة من تطبيق تزوير موقع (يكشفه الجهاز)}
      required: [lat, lng, accuracy_m]
      description: نقطة موقع تُلتقط لحظة الحدث فقط (بدء/إنهاء الدوام، الزيارة، إضافة جهة). لا يوجد تتبّع مستمر.
    ItemType:
      type: string
      enum: [PRODUCT, SAMPLE, PROMO]
      description: 'منتج / عينة / مادة دعائية — لا تختلط: لكل نوع رصيده ومواقعه'
    Portfolio:
      type: string
      enum: [CORE, GROWTH, TRIAL]
      description: 'المحفظة: أساسي / نمو / تجريبي'
    LocationType:
      type: string
      enum: [WAREHOUSE, AGENT, REP]
      description: المستودع يحمل كل الأنواع، الوكيل المنتجات وحدها، المندوب العينات والمواد وحدها
    BatchStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
      description: شغّالة / موقوفة
    TransferStatus:
      type: string
      enum: [IN_TRANSIT, RECEIVED, CANCELLED]
      description: بالطريق / مستلم / ملغى — لا استلام جزئي ولا رفض
    WithdrawStatus:
      type: string
      enum: [REQUESTED, HANDED_OVER, CANCELLED]
      description: مطلوب / مسلَّم / ملغى
    SampleRequestStatus:
      type: string
      enum: [NEW, DISPATCHED, REJECTED, CANCELLED]
      description: طلب العينات المباشر
    DeliveryStatus:
      type: string
      enum: [UNPAID, PAID, APPROVAL_PENDING, CANCELLED, WRITTEN_OFF]
      description: غير مسدد / مسدد / بانتظار اعتماد إلغاء أو شطب / ملغى / مشطوب. لا دفعات جزئية
    ReturnStatus:
      type: string
      enum: [PENDING, RESTOCKED, DAMAGED, REJECTED]
      description: مرتجع الصيدلية وتقرير التالف
    AgentReturnStatus:
      type: string
      enum: [PENDING, IN_TRANSIT, REJECTED, RECEIVED]
      description: إرجاع الوكيل إلى المستودع
    StockCountStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, APPROVED, CANCELLED]
      description: الجرد
    Responsibility:
      type: string
      enum: [AGENT, WAREHOUSE, MANUFACTURER, OTHER]
      description: مسؤولية التالف — للعلم لا ذمة مالية
    VisitStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED]
      description: جارية / منتهية
    VisitVerification:
      type: string
      enum: [OK, FLAGGED, CONFIRMED, REJECTED]
      description: سليمة / مشكوك فيها / مؤكدة / مرفوضة (تُستبعد من المؤشرات)
    CloseSource:
      type: string
      enum: [MANUAL, AUTO]
      description: 'مصدر الإغلاق: يدوي من الجهاز أو آلي على الخادم'
    PhotoStatus:
      type: string
      enum: [NONE, PENDING, UPLOADED]
      description: حالة رفع صورة الزيارة
    InterestLevel:
      type: string
      enum: [HIGH, MEDIUM, LOW, NONE]
      description: مستوى اهتمام العميل
    FlagType:
      type: string
