    IntelType:
      type: string
      enum: [COMPETITOR_PRICE, NEW_PRODUCT, COMPETITOR_OFFER, REQUESTED_PRODUCT, STAGNANT_PRODUCT]
      description: نوع معلومات السوق
    RoleRef:
      type: object
